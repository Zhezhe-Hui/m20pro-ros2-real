logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8555
rtmp: no
srt: no
moq: no
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsAlwaysRemux: no
hlsVariant: lowLatency
hlsSegmentCount: 12
hlsSegmentDuration: 500ms
hlsPartDuration: 100ms

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: [10.21.31.104]

paths:
  video1:
    source: rtsp://10.21.31.103:8554/video1
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
    rtspTransport: tcp
  video2:
    source: rtsp://10.21.31.103:8554/video2
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
    rtspTransport: tcp
