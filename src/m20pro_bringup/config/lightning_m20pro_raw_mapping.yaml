common:
  # Dense full-field profile.  104 cannot reach the vendor /LIDAR/POINTS DDS
  # locators (33-network only); the 106 dense passthrough + 104 socket bridge
  # republish the raw 96-line cloud (native x/y/z/intensity/ring/timestamp,
  # point_step=26) as a native ROS2 topic.  See
  # tools/edge_scan_feasibility/drdds_dense_passthrough.cpp.
  lidar_topic: "/m20pro/lidar_points_dense_ros"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/IMU"

fasterlio:
  lidar_type: 4
  # Raw input can contain 90k+ points per message on a field dog.  Keep the
  # ARM mapper bounded before keyframes retain a copy of every scan.
  scan_line: 96
  blind: 0.5
  time_scale: 1e-3
  # Use every scan for temporal coverage. The point budget below already
  # bounds the mapper load, while skipping every other scan leaves avoidable
  # gaps during slow walking and turns.
  skip_lidar_num: 0
  # 2026-08-31 walk-divergence root cause: since the 08-27 time-contract
  # fix the raw merge delivers BOTH lidars fully (~94k pts/frame; the old
  # cross-cycle pairing bug silently dropped most of one lidar). filter 6
  # then fed 15.7k pts/frame -> 0.7-1.0s processing at 10Hz input ->
  # backlog, dropped frames and walk divergence at kf 68 (38s in).
  # 94k/24 ~= 3.9k pts/frame is exactly the regime measured 2026-08-29 at
  # ~50ms/frame with two orders of headroom; 0.5m voxels keep the finished
  # map density voxel-bound regardless. Still ~2x the official M20 point
  # budget per second.
  point_filter_num: 24
  max_iteration: 4
  # 2026-08-21 关键帧密度与发散保护(原厂硬编码 2.0m/15deg/无时间兜底):
  # - 机器狗慢速室内行走 ~0.1-0.4 m/s, 2m 一帧关键帧导致 18.7m 走动仅
  #   ~10 帧存档(24k 点), 原地建图更是整场只有首帧一个关键帧(前台地图
  #   "中间空洞/单帧图"的直接原因)。0.5m/5deg 与慢速匹配, 内存仍可控
  #   (关键帧存的是 0.1m 体素抽稀副本, ~3k 点/帧)。
  # - kf_time_th: 建图模式时间兜底, 静止/缓慢挪动时每 5s 留一帧, 保证
  #   原地小幅移动的多视角观测进入存档。
  # - diverge_*: LIO 发散判据(位置界限/帧间等效速度/连续无有效匹配),
  #   判散后停止关键帧增长并拒绝存档, 前端经 status 得到告警。
  kf_dis_th: 0.5
  kf_angle_th_deg: 5.0
  kf_time_th: 5.0
  diverge_pos_bound_m: 500.0
  diverge_vel_bound_mps: 8.0
  diverge_fast_streak: 3
  diverge_no_effect_frames: 100
  filter_size_scan: 0.5
  # 2026-09-01 楼梯建图: 0.5m 体素把台阶立面(0.15-0.2m)糊成斜坡, 存档地图
  # 特征不清。0.2m 保留台阶几何; 每帧扫描滤波(scan)不变, 不增加逐帧算力。
  filter_size_map: 0.2
  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1
  use_aa: false
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_T: [0, 0, 0]
  extrinsic_R: [1, 0, 0,
                0, 1, 0,
                0, 0, 1]
  keep_first_imu_estimation: false

g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.50
  max_th_floor: 1.0
  grid_map_resolution: 0.2

system:
  # Raw mapping must correct accumulated drift when the robot returns to an
  # already mapped area. The loop worker uses the keyframe clouds and the
  # saved map consumes optimized poses; the 2.5D grid remains disabled.
  with_loop_closing: true
  # Raw tests should stay headless unless the operator explicitly enables UI.
  with_ui: false
  with_2dui: false
  with_g2p5: false
  step_on_kf: false
  enable_lidar_loc_skip: false
  log_pose_opt: false
  pub_odom: true
  enable_lidar_loc_rviz: false
  rviz_current_scan_topic: "/current_scan_cloud"
  rviz_global_map_topic: "/global_map_cloud"
  enable_path_rviz: true
  enable_lidar_odom_skip: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ./data/m20pro_lightning_raw/
  pub_tf: true
  # 2026-08-19 根因修复: M20 为 6 轴 IMU (无磁力计, 见 docs/m20pro_dev_manual/
  # m20pro_manual_imu.md), 原厂 /IMU 的 orientation 是 AOS 融合姿态且会冻结
  # (08-19 会话 34 分钟内 q_meas 恒定 yaw≈-25° 而机器狗在行走)。
  # use_imu_orient=true 会用该冻结姿态做初始朝向并持续拉拽 ESKF 姿态观测
  # ( OriObsModel, 方差 0.01 rad^2), 与 LiDAR 匹配对抗导致姿态发散、位置
  # 指数漂移。关闭后姿态由陀螺/加计传播 + LiDAR 观测确定 (roll/pitch 靠
  # 重力, yaw 靠匹配), 即 6 轴 IMU 的标准 LIO 用法。
  use_imu_orient: false

loop_closing:
  loop_kf_gap: 10
  min_id_interval: 20
  closest_id_th: 20
  max_range: 60.0
  # 2026-08-31 整层漂移修复（16:23 会话实测: NDT 分值 p50=2.43, th=1.0 时
  # 82% 候选通过≈无过滤; 提到 2.0 只留高质量对齐对）。
  # 2026-09-01: 快步行走整层会话(15:07)回环 NDT 分值 p50=1.38, th=2.0 把
  # 72 个候选砍到 16 个, 约束不足→漂移拉不回。1.5 放更多候选进来, 一致性
  # 仍由 rk_loop_th 的 Cauchy 剔除兜底。
  ndt_score_th: 1.5
  with_height: true
  # Cauchy 核剔除阈值(误差平方): 原 5.2/5=1.04 对应 ~0.15m 闭合误差, 整层
  # 会话 66% 回环边被永久剔除→漂移拉不回的恶性循环; 6.25 对应 ~0.4m。
  rk_loop_th: 6.25
  # 图优化权重: 回环约束强于里程(原 0.2m/3deg 与里程同量级, 拉不动漂移)。
  # 注意: 这些键在 2026-08-31 之前被 Init 的读取顺序 bug 静默忽略。
  motion_trans_noise: 0.3
  motion_rot_noise_deg: 3.0
  loop_trans_noise: 0.1
  loop_rot_noise_deg: 1.5

lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false

maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false

pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01

roi:
  # 注意: 实测发现 height_max/min 在当前 Lightning 版本的 RoboSense 路径是
  # 死参数 (SetHeightROI 只存储、无任何 handler 读取), 0.5 或 3.0 均不影响
  # 建图输出。保留 3.0 仅为语义正确, 不要依赖它做高度过滤。
  height_max: 3.0
  height_min: -2.0
  range_max: 70
  range_min: 3.0

ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
